<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Toggle with Dots Preview</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 20px;
      padding: 20px;
      font-family: -apple-system, "Segoe UI", sans-serif;
      background: #f5f5f5;
    }

    .demo-section {
      background: white;
      padding: 30px;
      margin-bottom: 30px;
      border: 2px solid #a1a1aa;
      box-shadow: 4px 4px 0 #e4e4e7;
    }

    h2 {
      margin-top: 0;
      font-size: 18px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #3f3f46;
    }

    /* Toggle styles */
    .toggle-group {
      display: flex;
      gap: 12px;
      background: #e0e0e0;
      padding: 4px 8px;
      width: fit-content;
    }

    .toggle-btn {
      font-weight: 700;
      font-size: 17px;
      border: 2px solid #8e8e96;
      background: #fff;
      color: #0a0a0a;
      padding: 6px 14px;
      cursor: pointer;
      border-radius: 0;
      display: flex;
      align-items: center;
      gap: 6px;
      font-family: inherit;
    }

    .toggle-btn.active {
      background: #0a0a0a;
      color: #fff;
    }

    .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #0a0a0a;
      flex-shrink: 0;
    }

    .toggle-btn.active .dot {
      background: #fff;
    }

    .label {
      display: block;
      margin-top: 20px;
      font-size: 14px;
      color: #3f3f46;
    }
  </style>
</head>
<body>
  <h1>Toggle with Dots Preview</h1>

  <div class="demo-section">
    <h2>Language Toggle</h2>
    <div class="toggle-group">
      <button class="toggle-btn active">
        <span class="dot"></span>中文
      </button>
      <button class="toggle-btn">
        EN
      </button>
    </div>
    <span class="label">Click to toggle between Chinese and English</span>
  </div>

  <div class="demo-section">
    <h2>Mode Toggle (Amount / Percent)</h2>
    <div class="toggle-group">
      <button class="toggle-btn active">
        <span class="dot"></span>$ 金额
      </button>
      <button class="toggle-btn">
        % 比例
      </button>
    </div>
    <span class="label">Click to toggle between amount and percentage mode</span>
  </div>

  <div class="demo-section">
    <h2>What the dots look like when inactive</h2>
    <div class="toggle-group">
      <button class="toggle-btn">
        中文
      </button>
      <button class="toggle-btn active">
        <span class="dot"></span>EN
      </button>
    </div>
    <span class="label">The dot only appears on the active (selected) button</span>
  </div>

  <script>
    document.querySelectorAll('.toggle-btn').forEach(btn => {
      btn.addEventListener('click', function() {
        const group = this.parentElement;
        group.querySelectorAll('.toggle-btn').forEach(b => b.classList.remove('active'));
        this.classList.add('active');
      });
    });
  </script>
</body>
</html>
